<!DOCTYPE html>
<html>
<head>
    <title>Update College Event</title>
</head>
<body>

    <h1 align="center">COLLEGE EVENT MANAGEMENT</h1>
    <h2 align="center">Update Event Details</h2>

    <form action="/update" method="POST">

        Event ID:
        <input type="number" name="event_id" required>
        <br><br>

        Event Name:
        <input type="text" name="event_name" required>
        <br><br>

        Event Date:
        <input type="date" name="event_date" required>
        <br><br>

        Venue:
        <input type="text" name="venue" required>
        <br><br>

        Organizer:
        <input type="text" name="organizer" required>
        <br><br>

        <button type="submit">Update Event</button>

    </form>

    <br>
    <a href="list.html">View Events</a>

</body>
</html>
